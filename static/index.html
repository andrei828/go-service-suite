<!doctype html>
<html>
<head>
    <title>Video processing</title>
    <style>
        video {
            width: 640px;
            height: 360px;
        }
    </style>
</head>
<body>
<div>
    <video id="videoPlayer" controls></video>
</div>
<script src="https://cdn.dashjs.org/v3.1.0/dash.all.min.js"></script>
<script>
    var player;
    var isEditing = false;

    function uuidv4() {
        return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
            (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
        );
    }

    (function () {
        instanceUUID = uuidv4()
        var url = "https://localhost/download_video";
        player = dashjs.MediaPlayer().create();
        console.log(dashjs.MediaPlayer.events)
        player.on(dashjs.MediaPlayer.events['PLAYBACK_PAUSED'], async (e) => await playerPaused(e, player))
        player.on(dashjs.MediaPlayer.events['PLAYBACK_PLAYING'], async(e) => await playerPlayed(e, player))
        player.on(dashjs.MediaPlayer.events['PLAYBACK_SEEKING'], async (e) => await playerUpdatedTime(e, player))
        player.initialize(document.querySelector("#videoPlayer"), url, true);

        const eventSource = new EventSource('https://localhost/stream_event');

        eventSource.onmessage = event => {
            let streamEvent = JSON.parse(event.data)
            if (streamEvent.sessionId === instanceUUID) {
                return
            }
            console.log(`Received the ${streamEvent.message} event from ${streamEvent.sessionId}`)
            let time = parseInt(streamEvent.message) || -1
            if (time !== -1) {
                player.seek(time)
            } else if (streamEvent.message === "play") {
                player.play()
            } else if (streamEvent.message === "pause") {
                player.pause()
            }
        };
    })();
    
    async function playerPaused(event, player) {
        console.log("player paused")
        const response = await fetch("https://localhost/register_event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ "message": "pause", "sessionId": instanceUUID }),
        });
    }

    async function playerPlayed(event, player) {
        console.log("player played")
        const response = await fetch("https://localhost/register_event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ "message": "play", "sessionId": instanceUUID }),
        });
    }

    async function playerUpdatedTime(event, player) {
        console.log("player seeked")
        const response = await fetch("https://localhost/register_event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ "message": `${player.time()}`, "sessionId": instanceUUID }),
        });
    }
    
    async function setTime(newTime) {
        if (isEditing) {
            return;
        }
        const response = await fetch("https://localhost/register_event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ "message": `${newTime}` }),
        });
    }
</script>
</body>
</html>
